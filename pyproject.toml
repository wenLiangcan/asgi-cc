[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asgi-cc"
version = "0.2.0"
description = "Cranker v3 connector for ASGI applications"
readme = "README-pypi.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = ["asgi", "cranker", "proxy", "fastapi", "websocket"]
dependencies = [
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://github.com/wenLiangcan/asgi-cc"
Repository = "https://github.com/wenLiangcan/asgi-cc"
Issues = "https://github.com/wenLiangcan/asgi-cc/issues"

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "ty>=0.0.96",
    "uvicorn>=0.54.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["asgi_cc*"]
